jobs:
  okf-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dzangolab/okf-actions/validate@d0fe9c714c28801b5df176061e3baeb6c5e8c72b # v3.0.1

name: OKF validate

on:

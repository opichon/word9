jobs:
  okf-approve:
    if: github.event.action != 'closed' || github.event.pull_request.merged
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: dzangolab/okf-actions/approve@d0fe9c714c28801b5df176061e3baeb6c5e8c72b # v3.0.1

name: OKF approve

on:
  pull_request:
    types: [closed, opened, reopened, synchronize]
